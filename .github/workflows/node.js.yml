name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-ci
        JWT_EXPIRES: 1h
        JWT_REFRESH_SECRET: test-refresh-ci

    - name: Run integration tests
      run: npm run test:integration
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-ci
        JWT_EXPIRES: 1h
        JWT_REFRESH_SECRET: test-refresh-ci

    - name: Run full test suite with coverage
      run: npm test
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-ci
        JWT_EXPIRES: 1h
        JWT_REFRESH_SECRET: test-refresh-ci
        IDRIVE_BUCKET: test-bucket
        IDRIVE_REGION: us-east-1
        IDRIVE_ENDPOINT: https://s3.us-east-1.idrivee2.com
        IDRIVE_ACCESS_KEY: test-key
        IDRIVE_SECRET_KEY: test-secret
